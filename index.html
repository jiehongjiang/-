<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory · 电脑产品出入库管理系统</title>
  <meta name="description" content="Neo-Tech 风格的电脑产品出入库管理工作台" />

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- 图标 -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

  <!-- 样式 -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <!-- 全局背景层 -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient-grid"></div>
    <div class="ambient-glow ambient-glow--cyan"></div>
    <div class="ambient-glow ambient-glow--amber"></div>
    <div class="ambient-noise"></div>
    <div class="ambient-scan"></div>
  </div>

  <!-- 自定义光标 -->
  <div class="cursor-dot" aria-hidden="true"></div>

  <!-- 应用根节点 -->
  <div id="app" class="app-root"></div>

  <!-- Toast 容器 -->
  <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <!-- 模态框挂载点 -->
  <div id="modal-root"></div>

  <!-- 应用入口 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
