<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业电脑配置单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0c0c1e 0%, #1a1a3e 45%, #0f1729 100%);
            min-height: 100vh;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 20% 20%, rgba(102, 126, 234, 0.18), transparent 24%), radial-gradient(circle at 80% 10%, rgba(255, 255, 255, 0.12), transparent 18%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            right: -15%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 80% 90%, rgba(255, 205, 86, 0.14), transparent 26%), radial-gradient(circle at 60% 50%, rgba(56, 185, 255, 0.08), transparent 25%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 18px;
            animation: fadeIn 0.6s ease;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(10%, 10%); }
        }

        header h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
            letter-spacing: 2px;
        }

        .config-table {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            overflow: visible;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            z-index: 1;
        }

        .table-header {
            display: grid;
            grid-template-columns: 54px minmax(0, 1fr) 44px;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 50%, #667eea 100%);
            padding: 15px 10px;
            font-weight: 600;
            color: white;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 16px 16px 0 0;
        }

        .table-header > div {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .table-row {
            display: grid;
            grid-template-columns: 54px minmax(0, 1fr) 44px;
            min-height: 46px;
            padding: 4px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            align-items: center;
            transition: all 0.3s ease;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .table-row:hover {
            background: rgba(255,255,255,0.03);
        }

        .type-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            height: 42px;
            padding: 0 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.4px;
            box-shadow: 0 5px 18px rgba(102, 126, 234, 0.2);
            position: relative;
        }

        .table-row.required .type-badge {
            padding-left: 18px;
        }

        .table-row.required .type-badge::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 4px;
            background: linear-gradient(180deg, #ffb86c 0%, #ff6cdb 100%);
            border-radius: 999px;
        }

        .searchable-select {
            position: relative;
            width: 100%;
            padding: 0 5px;
            z-index: 10;
        }

        .select-trigger {
            width: 100%;
            height: 34px;
            padding: 0 40px 0 12px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.16);
            border-radius: 14px;
            color: rgba(255,255,255,0.95);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        .quantity-input {
            width: 48px;
            height: 34px;
            padding: 0 10px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            text-align: center;
            transition: all 0.25s ease;
            appearance: none;
            -moz-appearance: textfield;
        }

        .select-trigger span:first-child {
            display: inline-block;
            width: calc(100% - 24px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .select-trigger:hover {
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(255,255,255,0.12);
        }

        .select-trigger:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.15);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
        }

        .select-arrow {
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid white;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
            position: absolute;
            right: 15px;
        }

        .select-arrow.open {
            transform: rotate(180deg);
        }

        .select-dropdown {
            position: fixed;
            background: #14142b;
            border-radius: 16px;
            border: 2px solid #667eea;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-height: 320px;
            overflow: hidden;
            z-index: 99999;
            display: none;
            animation: slideDown 0.15s ease;
            opacity: 1;
        }

        @keyframes slideDown {
            from { opacity: 1; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .select-dropdown.open {
            display: block;
            pointer-events: auto;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            color: white;
            font-size: 15px;
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .search-input:focus {
            outline: none;
        }

        .select-options {
            max-height: 250px;
            overflow-y: auto;
        }

        .select-options::-webkit-scrollbar {
            width: 8px;
        }

        .select-options::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }

        .select-options::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 4px;
        }

        .select-option {
            padding: 14px 20px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .select-option:hover {
            background: rgba(102, 126, 234, 0.25);
        }

        .select-option.selected {
            background: rgba(102, 126, 234, 0.4);
        }

        .quantity-input::-webkit-outer-spin-button,
        .quantity-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .quantity-input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.15);
        }

        .total-section {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.18) 0%, rgba(118, 75, 162, 0.18) 100%);
            border-radius: 24px;
            padding: 18px 22px;
            margin-top: 25px;
            box-shadow: 0 30px 90px rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.14);
            position: relative;
            overflow: hidden;
        }

        .total-row {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px 0;
        }

        .total-note {
            margin-top: 8px;
            color: rgba(255,255,255,0.65);
            font-size: 14px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .total-label {
            color: rgba(255,255,255,0.9);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .total-value {
            color: #ffd700;
            font-size: 36px;
            font-weight: 700;
            margin-left: 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }

        .total-value.waiting {
            color: rgba(255,255,255,0.5);
            font-size: 20px;
            text-shadow: none;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 16px 30px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-4px);
        }

        .btn:active {
            transform: translateY(-2px);
        }

        .btn-clear {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-clear:hover {
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        .btn-screenshot {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.4);
        }

        .btn-screenshot:hover {
            box-shadow: 0 12px 35px rgba(240, 147, 251, 0.5);
        }


        .btn-save {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #1a1a2e;
            box-shadow: 0 8px 25px rgba(67, 233, 123, 0.4);
        }

        .btn-save:hover {
            box-shadow: 0 12px 35px rgba(67, 233, 123, 0.5);
        }

        .saved-configs {
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .saved-configs h3 {
            color: white;
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .no-saved {
            text-align: center;
            color: rgba(255,255,255,0.4);
            padding: 50px;
            font-size: 16px;
        }

        .saved-item {
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .saved-item:hover {
            background: rgba(255,255,255,0.08);
            transform: scale(1.02);
        }

        .saved-item span {
            color: white;
            font-size: 15px;
        }

        .saved-item button {
            background: rgba(245, 87, 108, 0.3);
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            color: #f5576c;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .saved-item button:hover {
            background: rgba(245, 87, 108, 0.5);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
                margin: 0;
            }

            .container {
                padding: 10px;
            }

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 20px;
            }

            .table-header {
                grid-template-columns: 50px minmax(0, 1fr) 40px;
                font-size: 12px;
                padding: 10px 8px;
            }

            .table-row {
                grid-template-columns: 50px minmax(0, 1fr) 40px;
                padding: 5px 8px;
            }

            .type-badge {
                min-height: 30px;
                height: 30px;
                padding: 0 8px;
                font-size: 11px;
            }

            .select-trigger {
                height: 32px;
                padding: 0 30px 0 10px;
                font-size: 13px;
            }
            
            .select-arrow {
                right: 10px;
            }

            .quantity-input {
                width: 40px;
                padding: 6px 4px;
                font-size: 12px;
            }

            .total-section {
                padding: 8px 12px;
            }

            .total-value {
                font-size: 22px;
            }

            .total-value.waiting {
                font-size: 14px;
            }

            .btn {
                padding: 12px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ 专业电脑配置单</h1>
        </header>

        <div class="config-table">
            <div class="table-header">
                <div>类型</div>
                <div>硬件名称</div>
                <div>数量</div>
            </div>
            
            <div class="table-row required" data-category="cpu">
                <div class="type-badge">CPU</div>

                        <span>请选择CPU</span>

                    <div class="select-dropdown">
                        <input type="text" class="search-input" placeholder="搜索CPU...">

            <div class="table-row" data-category="other">

                <div class="searchable-select" data-field="other">
                    <div class="select-trigger">
                        <span>请选择其它配件</span>

                    <div class="select-dropdown">
                        <input type="text" class="search-input" placeholder="搜索配件...">
                        <div class="select-options"></div>

        <div class="total-section">

            ],

                { id: 'mon-3', name: 'AOC 27G2SP', price: 1299 },
                { id: 'mon-4', name: '戴尔U2723QE', price: 4499 },
                { id: 'mon-5', name: '宏碁Predator XB273U', price: 3299 }
            ],
            cpuFan: [
                { id: 'cf-1', name: '猫头鹰NH-D15', price: 699 },
                { id: 'cf-2', name: '九州风神AK620', price: 299 },
                { id: 'cf-3', name: '利民PA120 SE', price: 149 },
                { id: 'cf-4', name: '酷冷至尊ML360R', price: 599 },
                { id: 'cf-5', name: '追风者TC12DX', price: 199 }
            ],
            caseFan: [
                { id: 'cfan-1', name: '联力积木风扇SL120', price: 199 },
                { id: 'cfan-2', name: '追风者SK PWM', price: 89 },
                { id: 'cfan-3', name: '利民TL-C12S', price: 59 }
            ],
            keymouse: [
                { id: 'kbm-1', name: '雷蛇黑寡妇V4 + 罗技G502 HERO', price: 1599 },
                { id: 'kbm-2', name: '罗技G915 TKL + 雷蛇炼狱蝰蛇V3', price: 1999 },
                { id: 'kbm-3', name: '樱桃MX 3.0S + 赛睿Sensei Ten', price: 999 },
                { id: 'kbm-4', name: '达尔优A87 + 卓威EC2-C', price: 679 }
            ],
            speaker: [
                { id: 'spk-1', name: '漫步者R1700BT', price: 399 },
                { id: 'spk-2', name: '惠威D1080MKII', price: 599 },
                { id: 'spk-3', name: '罗技Z623', price: 699 },
                { id: 'spk-4', name: '雷蛇天狼星幻彩版', price: 899 }
            ],
            other: [
                { id: 'other-1', name: '显示器支架', price: 299 },
                { id: 'other-2', name: 'USB集线器', price: 99 },
                { id: 'other-3', name: '网线', price: 39 },
                { id: 'other-4', name: 'HDMI线', price: 69 }
            ]
        };

        const selectedProducts = {};
        const requiredCategories = ['cpu', 'motherboard', 'memory', 'harddisk1', 'power', 'case'];
        let activeDropdown = null;

        function initSelects() {
            const selects = document.querySelectorAll('.searchable-select');
            
            selects.forEach(select => {
                const field = select.dataset.field;
                const trigger = select.querySelector('.select-trigger');
                const dropdown = select.querySelector('.select-dropdown');
                const searchInput = select.querySelector('.search-input');
                const optionsContainer = select.querySelector('.select-options');
                
                renderOptionsForField(field, optionsContainer);
                
                searchInput.addEventListener('input', (e) => {
                    renderOptionsForField(field, optionsContainer, e.target.value);
                });
                
                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleDropdown(select, field);
                });
            });
            
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.searchable-select') && !e.target.closest('.select-dropdown')) {
                    closeAllDropdowns();
                }
            });
        }

        let currentSelect = null;
        
        function toggleDropdown(select, field) {
            const dropdown = select.querySelector('.select-dropdown');
            const trigger = select.querySelector('.select-trigger');
            
            if (activeDropdown) {
                activeDropdown.classList.remove('open');
                activeDropdown.style.display = 'none';
                if (currentSelect) {
                    const prevTrigger = currentSelect.querySelector('.select-trigger');
                    prevTrigger.querySelector('.select-arrow').classList.remove('open');
                    currentSelect.appendChild(activeDropdown);
                }
            }
            
            if (dropdown.classList.contains('open')) {
                dropdown.classList.remove('open');
                dropdown.style.display = 'none';
                trigger.querySelector('.select-arrow').classList.remove('open');
                activeDropdown = null;
                currentSelect = null;
            } else {
                document.body.appendChild(dropdown);
                positionDropdown(select, dropdown);
                dropdown.classList.add('open');
                dropdown.style.display = 'block';
                trigger.querySelector('.select-arrow').classList.add('open');
                activeDropdown = dropdown;
                currentSelect = select;
                
                const searchInput = dropdown.querySelector('.search-input');
                searchInput.value = '';
                renderOptionsForField(field, dropdown.querySelector('.select-options'));
                searchInput.focus();
            }
        }

        function positionDropdown(select, dropdown) {
            const trigger = select.querySelector('.select-trigger');
            const rect = trigger.getBoundingClientRect();
            const dropdownWidth = rect.width;
            
            dropdown.style.width = dropdownWidth + 'px';
            dropdown.style.left = rect.left + 'px';
            dropdown.style.top = (rect.bottom + 10) + 'px';
        }

        function renderOptionsForField(field, container, filter = '') {
            container.innerHTML = '';
            const filtered = products[field].filter(p => 
                p.name.toLowerCase().includes(filter.toLowerCase())
            );
            
            if (filtered.length === 0) {
                const noResult = document.createElement('div');
                noResult.className = 'select-option';
                noResult.textContent = '没有找到匹配的产品';
                noResult.style.color = '#f5576c';
                container.appendChild(noResult);
                return;
            }
            
            filtered.forEach(product => {
                const option = document.createElement('div');
                option.className = 'select-option';
                if (selectedProducts[field]?.id === product.id) {
                    option.classList.add('selected');
                }
                option.textContent = product.name;
                option.addEventListener('click', () => selectProduct(field, product));
                container.appendChild(option);
            });
        }

        function closeAllDropdowns() {
            if (activeDropdown && currentSelect) {
                activeDropdown.classList.remove('open');
                activeDropdown.style.display = 'none';
                const trigger = currentSelect.querySelector('.select-trigger');
                trigger.querySelector('.select-arrow').classList.remove('open');
                currentSelect.appendChild(activeDropdown);
            }
            activeDropdown = null;
            currentSelect = null;
        }

        function selectProduct(field, product) {
            selectedProducts[field] = product;
            
            const select = document.querySelector(`.searchable-select[data-field="${field}"]`);
            const trigger = select.querySelector('.select-trigger span:first-child');
            trigger.textContent = `${product.name} · ¥${product.price}`;
            
            closeAllDropdowns();
            
            calculateTotal();
        }

        function calculateTotal() {
            const requiredSelected = requiredCategories.every(cat => selectedProducts[cat]);
            
            const totalEl = document.getElementById('total');
            if (!requiredSelected) {
                totalEl.textContent = '请先完成基础配置';
                totalEl.className = 'total-value waiting';
                return;
            }
            
            let subtotal = 0;
            Object.keys(selectedProducts).forEach(field => {
                const price = Math.floor(selectedProducts[field].price);
                const quantity = Math.max(1, parseInt(document.querySelector(`.quantity-input[data-field="${field}"]`).value) || 1);
                subtotal += price * quantity;
            });
            
            const profit = subtotal * 0.1 >= 400 ? Math.ceil(subtotal * 0.1) : 400;
            const total = Math.floor(subtotal + profit);
            
            totalEl.textContent = `¥ ${total.toLocaleString()}`;
            totalEl.className = 'total-value';
        }

        function clearAll() {
            Object.keys(selectedProducts).forEach(field => {
                delete selectedProducts[field];
            });
            
            document.querySelectorAll('.select-trigger span:first-child').forEach(span => {
                const category = span.parentElement.parentElement.closest('.table-row').dataset.category;
                span.textContent = `请选择${getCategoryName(category)}`;
            });
            
            document.querySelectorAll('.quantity-input').forEach(input => input.value = '1');
            
            calculateTotal();
        }

        function getCategoryName(category) {
            const names = {
                cpu: 'CPU',
                motherboard: '主板',
                memory: '内存',
                harddisk1: '硬盘1',
                harddisk2: '硬盘2',
                power: '电源',
                case: '机箱',
                gpu: '显卡',
                monitor: '显示器',
                cpuFan: 'CPU风扇',
                caseFan: '机箱风扇',
                keymouse: '键鼠',
                speaker: '音响',
                other: '其它配件'
            };
            return names[category] || category;
        }

        function saveConfig() {
            const config = {
                selected: JSON.parse(JSON.stringify(selectedProducts)),
                timestamp: Date.now()
            };
            
            const saved = JSON.parse(localStorage.getItem('pcConfigs') || '[]');
            saved.push(config);
            localStorage.setItem('pcConfigs', JSON.stringify(saved));
            
            alert('配置已保存！');
            renderSavedConfigs();
        }

        function renderSavedConfigs() {
            const saved = JSON.parse(localStorage.getItem('pcConfigs') || '[]');
            const list = document.getElementById('savedList');
            
            if (saved.length === 0) {
                list.innerHTML = '<div class="no-saved">暂无保存的配置</div>';
                return;
            }
            
            list.innerHTML = saved.map((config, index) => {
                let total = 0;
                Object.keys(config.selected).forEach(field => {
                    total += config.selected[field].price;
                });
                const profit = total * 0.1 >= 400 ? total * 0.1 : 400;
                const finalTotal = total + profit;
                
                return `
                    <div class="saved-item">
                        <span>配置 ${index + 1} - ¥${finalTotal.toLocaleString()}</span>
                        <button onclick="loadConfig(${index})">加载</button>
                        <button onclick="deleteConfig(${index})">删除</button>
                    </div>
                `;
            }).join('');
        }

        function loadConfig(index) {
            const saved = JSON.parse(localStorage.getItem('pcConfigs') || '[]');
            const config = saved[index];
            
            Object.keys(config.selected).forEach(field => {
                if (document.querySelector(`.searchable-select[data-field="${field}"]`)) {
                    selectProduct(field, config.selected[field]);
                }
            });
            
            calculateTotal();
        }

        function deleteConfig(index) {
            const saved = JSON.parse(localStorage.getItem('pcConfigs') || '[]');
            saved.splice(index, 1);
            localStorage.setItem('pcConfigs', JSON.stringify(saved));
            renderSavedConfigs();
        }

        function screenshotConfig() {
            alert('截图功能已触发！');
        }

        document.addEventListener('DOMContentLoaded', () => {
                initSelects();
                renderSavedConfigs();
                
                document.querySelectorAll('.quantity-input').forEach(input => {
                    input.addEventListener('change', (e) => {
                        calculateTotal();
                    });
                    input.addEventListener('focus', (e) => {
                        e.target.select();
                    });
                    input.addEventListener('click', (e) => {
                        e.target.select();
                    });
                });

            window.addEventListener('resize', () => {
                if (activeDropdown) {
                    const select = activeDropdown.parentElement;
                    positionDropdown(select, activeDropdown);
                }
            });

            window.addEventListener('scroll', () => {
                if (activeDropdown) {
                    const select = activeDropdown.parentElement;
                    positionDropdown(select, activeDropdown);
                }
            }, true);
        });
    </script>
